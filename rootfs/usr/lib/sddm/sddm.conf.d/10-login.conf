# The login screen (sddm.conf(5)); the theme is in /usr/share/sddm/themes/login.
[General]
# The default asks for Qt's on-screen keyboard, which the image does not ship.
InputMethod=

[Theme]
Current=login

[Users]
# systemd-homed gives its users the UIDs 60001 to 60513; the default list of
# users stops at 60000.
MaximumUid=60513

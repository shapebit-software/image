# The root volume's first-boot clear key is an empty passphrase, tried after
# the TPM. systemd-gpt-auto-generator creates this unit with fixed options, so
# this restates them and adds try-empty-password. Once the clear key is gone,
# the empty passphrase fails and the recovery key is asked for as usual.
[Service]
ExecStart=
ExecStart=/usr/bin/systemd-cryptsetup attach root /dev/gpt-auto-root-luks - tpm2-device=auto,tpm2-measure-pcr=yes,tpm2-measure-keyslot-nvpcr=cryptsetup,try-empty-password=yes

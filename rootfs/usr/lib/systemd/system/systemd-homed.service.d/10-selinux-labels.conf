# systemd-homework leaves the Btrfs inside a home without SELinux labels, so
# the login screen (xdm_t) may not enter an unlabeled home and cannot start a
# session in it. defcontext= labels what has no label as a home directory;
# files created later get their usual labels. The other options are
# systemd-homework's defaults for Btrfs, which this variable replaces.
[Service]
Environment=SYSTEMD_HOME_MOUNT_OPTIONS_BTRFS=noacl,compress=zstd:1,defcontext=system_u:object_r:user_home_dir_t:s0

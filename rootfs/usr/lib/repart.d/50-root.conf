# Grow the root partition (the LUKS2 volume) into any free space after it, as
# when a disk image is written to a larger disk. The LUKS2 volume spans the
# whole partition from the next unlock on, and systemd-growfs@var then grows
# Btrfs; it runs on /var because Btrfs grows through any writable mount of the
# filesystem and /sysroot is read-only.
[Partition]
Type=root
